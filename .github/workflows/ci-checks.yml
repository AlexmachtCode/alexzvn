name: CI Checks

# Leichte Qualitäts-/Sicherheits-Gates auf jedem PR + Push nach main (P4, #62).
# Kein nativer Build/Postinstall nötig → `npm ci --ignore-scripts` (wie
# cookbook-check.yml) spart die schweren Postinstalls (electron, better-sqlite3,
# freetype2). tsc braucht nur die TS-Typen, nicht die Binaries; gitleaks scannt
# die Quelldateien direkt.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (alle Workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install (ohne native Postinstalls)
        run: npm ci --ignore-scripts
      - name: tsc --noEmit (node + web)
        run: npm run typecheck --workspaces --if-present

  selftests:
    name: Selbsttests (Master-Link + Launcher)
    runs-on: ubuntu-latest
    # Echte Sockets und Fristen: ein hängender Test darf den Lauf nicht 6 h blockieren (Endprüfung E3).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 22: der Launcher-Selbsttest läuft mit --experimental-strip-types (≥ 22.6).
          node-version: 22
      - name: Install (ohne native Postinstalls)
        run: npm ci --ignore-scripts
      - name: Master-Link (TLS, Kopplung, Client — echte Sockets auf 127.0.0.1)
        run: npm run selftest -w @jm/master-link
      - name: Launcher (reine Helfer, Kopfanzeige, Presence)
        run: npm run selftest -w @jm/launcher
      - name: Launcher (Verbund-Rollen Master/Slave)
        run: npm run selftest:verbund -w @jm/launcher
      # Master-Link Teil 2a (Spec 9.7). Keiner dieser Tests lädt Electron — ohne
      # Postinstalls fehlt das Binary, ein Electron-Import bricht hier also ab.
      - name: Launcher (iveo-Abgleich-Kern, Hülle, Show-Editor)
        run: npm run selftest:iveo -w @jm/launcher
      - name: iveo + Show-Format (Kennungen von iveo bis in die Show)
        run: npm run selftest -w @jm/iveo
      - name: Timer (aktiver Punkt über die Kennung)
        run: npm run selftest -w @jm/timer
      - name: Rundown (Abgleich, Sprung, scharfe Zeile)
        run: npm run selftest -w @jm/rundown
      # Master-Link Teil 2b (Spec 9.5): DataLink-Kern und Datenquelle des Titlers, mit tsx, ohne Electron.
      - name: Titler (DataLink-Schlüssel, Datenquelle)
        run: npm run selftest -w @jm/titler
      # Zoom Stage 4a (Spec 12.6). Keiner dieser Tests lädt Electron oder braucht das Zoom-SDK.
      - name: Zoom-Bridge (Protokoll, Zustand, Attrappe — ohne SDK)
        run: npm run selftest -w @jm/zoom-bridge
      - name: Connect (Zoom-Kern gegen die Attrappe, Laufzeit, Statustexte)
        run: npm run selftest -w @jm/connect

  secret-scan:
    name: Secret-Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: gitleaks installieren
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Quellbaum auf Secrets prüfen
        # --no-git: aktuellen Dateibaum prüfen (kein node_modules — vor npm ci),
        # nicht die History. --redact: gefundene Werte nicht ins Log drucken.
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  audit:
    name: npm audit (Bericht, nicht blockierend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install (ohne native Postinstalls)
        run: npm ci --ignore-scripts
      - name: npm audit (high+)
        # Bewusst nicht blockierend: dokumentiert bekannte Schwachstellen als
        # Bericht, ohne PRs an (teils transitiven) Altlasten scheitern zu lassen.
        run: npm audit --audit-level=high || true
