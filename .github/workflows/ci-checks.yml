name: CI Checks

# Leichte Qualitäts-/Sicherheits-Gates auf jedem PR + Push nach main (P4, #62).
# Kein nativer Build/Postinstall nötig → `npm ci --ignore-scripts` (wie
# cookbook-check.yml) spart die schweren Postinstalls (electron, better-sqlite3,
# freetype2). tsc braucht nur die TS-Typen, nicht die Binaries; gitleaks scannt
# die Quelldateien direkt.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (alle Workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install (ohne native Postinstalls)
        run: npm ci --ignore-scripts
      - name: tsc --noEmit (node + web)
        run: npm run typecheck --workspaces --if-present

  selftests:
    name: Selbsttests (Master-Link + Launcher)
    runs-on: ubuntu-latest
    # Echte Sockets und Fristen: ein hängender Test darf den Lauf nicht 6 h blockieren (Endprüfung E3).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 22: der Launcher-Selbsttest läuft mit --experimental-strip-types (≥ 22.6).
          node-version: 22
      - name: Install (ohne native Postinstalls)
        run: npm ci --ignore-scripts
      - name: Master-Link (TLS, Kopplung, Client — echte Sockets auf 127.0.0.1)
        run: npm run selftest -w @jm/master-link
      - name: Launcher (reine Helfer, Kopfanzeige, Presence)
        run: npm run selftest -w @jm/launcher
      - name: Launcher (Verbund-Rollen Master/Slave)
        run: npm run selftest:verbund -w @jm/launcher
      # Master-Link Teil 2a (Spec 9.7). Keiner dieser Tests lädt Electron — ohne
      # Postinstalls fehlt das Binary, ein Electron-Import bricht hier also ab.
      - name: Launcher (iveo-Abgleich-Kern, Hülle, Show-Editor)
        run: npm run selftest:iveo -w @jm/launcher
      - name: iveo + Show-Format (Kennungen von iveo bis in die Show)
        run: npm run selftest -w @jm/iveo
      - name: Timer (aktiver Punkt über die Kennung)
        run: npm run selftest -w @jm/timer
      - name: Rundown (Abgleich, Sprung, scharfe Zeile)
        run: npm run selftest -w @jm/rundown
      # Master-Link Teil 2b (Spec 9.5): DataLink-Kern und Datenquelle des Titlers, mit tsx, ohne Electron.
      # Suite-UX-Update Welle 0 (Spec 11): derselbe Befehl startet danach die Oberflächentests (Render ohne Browser).
      - name: Titler (DataLink-Schlüssel, Datenquelle, Oberfläche)
        run: npm run selftest -w @jm/titler
      # #228 und #231: reine Node-Tests, ohne Electron und ohne DOM.
      - name: Presenter (Suite-Status, On Air nur in der Präsentation)
        run: npm run selftest -w @jm/presenter
      - name: Appkit (Spiellogik, Variable umbenennen)
        run: npm run selftest -w @jm/appkit
      - name: App Designer (Raster, Variablen im Store)
        run: npm run selftest -w @jm/app-designer
      # Suite-UX-Update Welle 0 (Spec 11): Bausteine und Einstellungs-Abschnitte. Render-Tests mit
      # renderToStaticMarkup unter tsx, ohne Browser und ohne Electron.
      - name: UI-Bausteine (Bestandsschutz, Tokens, Kontrast, Statusleiste, Tally)
        run: npm run selftest -w @jm/ui
      - name: Einstellungs-Abschnitte (Ableitungen als Kreuzprodukt)
        run: npm run selftest -w @jm/settings
      # Zoom Stage 4a (Spec 12.6). Keiner dieser Tests lädt Electron oder braucht das Zoom-SDK.
      - name: Zoom-Bridge (Protokoll, Zustand, Attrappe — ohne SDK)
        run: npm run selftest -w @jm/zoom-bridge
      - name: Connect (Zoom-Kern gegen die Attrappe, Laufzeit, Statustexte)
        run: npm run selftest -w @jm/connect
      # Zoom Stage 4b (Spec 12.6, 17.2 Nr. 2/3, N4b.2). Das Companion-Modul liegt außerhalb der
      # Workspaces; sein Selbsttest braucht nur Node. „npm rebuild esbuild“ ist Vorsorge (Spec 12.6):
      # Unter Windows lief esbuild ohne seine Postinstall, unter Linux nach `npm ci --ignore-scripts`
      # ist das ungemessen.
      - name: Steuerprotokoll (STATE-Kodierung, Capabilities)
        run: npm run selftest -w @jm/suite-control-protocol
      - name: Companion-Modul (Zeilenbau, Feedbacks, STATE)
        run: node packages/companion-jm-suite/test/selftest.mjs
      - name: Companion-Protokoll aktuell
        run: npm rebuild esbuild && node scripts/sync-companion-protocol.mjs && git diff --exit-code -- packages/companion-jm-suite/generated/protocol.mjs
      # Master-Link Teil 2b, Release 2 (Spec 19.6): derselbe Befehl prüft auch den Verbund der Tool-Seite
      # (Anzeige V1–V15, Abo-Zustand, Zwischenspeicher) mit tsx, ohne Electron. Genau ein Schritt dafür.
      # Suite-UX-Update Welle 0 (Spec 3.9): im selben Lauf die Master-Link-Meldung (Kanal jmps:master-link).
      - name: App-Laufzeit (Log-Aufräumen, CSP, Verbund-Anzeige, Abo-Zustand, Master-Link-Meldung)
        run: npm run selftest -w @jm/app-runtime

      # iveo-Paket (Spec 12.9): Paketwahl und Routing des Release-Proxys, ohne Netz (globaler fetch-Stub) und ohne
      # node_modules. Nicht über tsx: worker.js ist ESM ohne package.json (Kopf von worker.test.mjs).
      - name: Release-Proxy (Paketwahl, Routing)
        run: node --experimental-strip-types services/release-proxy/test/worker.test.mjs

      # Mac-Nachbau (Entwurf mac-fassungen, Stufe 1; Plan docs/superpowers/plans/2026-10-20-mac-nachbau-editor.md):
      # Prüfer samt der Lesestand-Datei im Repo, ffmpeg-Beilagen und Workflow-Regeln, je ein Schritt. Nur node:-Module,
      # ohne macOS (otool und Programmstart laufen nur im Workflow selbst). Der Beilagen-Test lädt
      # services/release-proxy/paketwahl.js; Node meldet dazu MODULE_TYPELESS_PACKAGE_JSON auf stderr, harmlos.
      # Unter Node 20 wie im Mac-Job: Job mac-nachbau-node20. !cancelled(): Die drei laufen auch nach einem roten Schritt
      # davor (sie brauchen kein npm ci), so verdeckt kein Test einen anderen; der Job bleibt dann trotzdem rot.
      - name: Mac-Nachbau (Prüfer, Lesestand-Datei)
        if: ${{ !cancelled() }}
        run: node scripts/ci/test/pruefe-mac-nachbau.test.mjs
      - name: Mac-Nachbau (ffmpeg-Beilagen)
        if: ${{ !cancelled() }}
        run: node scripts/ci/test/sammle-ffmpeg-beilagen.test.mjs
      - name: Mac-Nachbau (Workflow-Regeln)
        if: ${{ !cancelled() }}
        run: node scripts/ci/test/mac-nachbau-workflow.test.mjs

  # Prüfer und Sammler laufen im Mac-Job (mac-nachbau.yml) unter Node 20, die Selbsttests oben unter Node 22. Eine API
  # ab Node 21 fiele sonst erst im Mac-Lauf auf. Kein npm ci: Die Tests brauchen nur node:-Module und paketwahl.js.
  # --experimental-detect-module: paketwahl.js ist ESM ohne package.json mit type. Node 24 erkennt das von selbst
  # (gemessen, mit und ohne Schalter grün); Node 20 ist lokal ungemessen (kein Node 20 im Arbeitsplatz), der Schalter
  # macht es dort ausdrücklich. Der erste Lauf unter Node 20 ist der in der PR.
  mac-nachbau-node20:
    name: Mac-Nachbau unter Node 20 (wie im Mac-Job)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Prüfer, Lesestand-Datei
        run: node scripts/ci/test/pruefe-mac-nachbau.test.mjs
      - name: ffmpeg-Beilagen
        if: ${{ !cancelled() }}
        run: node --experimental-detect-module scripts/ci/test/sammle-ffmpeg-beilagen.test.mjs
      - name: Workflow-Regeln
        if: ${{ !cancelled() }}
        run: node scripts/ci/test/mac-nachbau-workflow.test.mjs

  secret-scan:
    name: Secret-Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: gitleaks installieren
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Quellbaum auf Secrets prüfen
        # --no-git: aktuellen Dateibaum prüfen (kein node_modules — vor npm ci),
        # nicht die History. --redact: gefundene Werte nicht ins Log drucken.
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  audit:
    name: npm audit (Bericht, nicht blockierend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install (ohne native Postinstalls)
        run: npm ci --ignore-scripts
      - name: npm audit (high+)
        # Bewusst nicht blockierend: dokumentiert bekannte Schwachstellen als
        # Bericht, ohne PRs an (teils transitiven) Altlasten scheitern zu lassen.
        run: npm audit --audit-level=high || true
