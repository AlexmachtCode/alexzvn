name: Suite Build (artifacts)

# Baut Workspace-Tools für macOS + Windows und lädt die Installer als
# herunterladbare Artefakte hoch (kein Release, keine Signatur).
# - workflow_dispatch: genau EIN Tool über die Eingabe `app`
# - push auf den Feature-Branch: baut ALLE Tools (Matrix) zum Testen
#   (temporär — vor dem Merge nach main wieder eindampfen).
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Workspace-Tool (Ordnername unter apps/, z. B. launcher, media-converter, copy)"
        default: "launcher"
        type: string
  push:
    branches: ["feat/jm-production-suite"]
    paths-ignore:
      - "**/*.md"

# Nur Artefakte, kein Release: Lesen genügt.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.app }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # Bei Dispatch genau das eingegebene Tool; bei Push nur der Launcher
        # (zum schnellen Testen). Die ganze Suite wurde mit Lauf 27010978032
        # einmalig grün gebaut — für erneute Vollbauten dispatch je Tool.
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.app) || '["launcher"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Die Eingabe `app` kommt nur über env in die Skripte (nie als Ausdruck in run) und muss ein
      # Ordnername unter apps/ sein; sonst bricht der Lauf hier ab, vor npm ci.
      - name: Tool prüfen
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          if ! printf '%s' "$APP" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || [ ! -f "apps/$APP/package.json" ]; then
            echo "::error::„$APP“ ist kein Ordner unter apps/ (erwartet z. B. launcher, media-converter, copy)."
            exit 1
          fi

      - name: Install (workspaces)
        run: npm ci

      - name: Build renderer/main (electron-vite)
        shell: bash
        run: npm run build -w "@jm/$APP"
        env:
          APP: ${{ matrix.app }}
          JMPS_PROXY_KEY: ${{ secrets.JMPS_PROXY_KEY }}

      # electron ist im Workspace ans Root gehoistet → Version in die Config
      # schreiben (shell-sicher, statt -c.electronVersion am CLI; pwsh zerlegt das).
      # npmRebuild: false → überspringt "installing production dependencies" im
      # appDir, das seit der Root-Hoisting-Lockfile die einzige 7zip-bin-Kopie
      # zerstört ("ENOENT chmod 7za"). Apps sind reines JS (vite bündelt in out/).
      # Nur ergänzen, was fehlt (wie suite-release.yml seit fa3417cbff): Die lokal gepackten Tools
      # (NDI/Audio/Editor) tragen beide Schlüssel selbst in ihrer Config. Ein zweites Vorkommen
      # überschreibt in YAML nicht, sondern ist ein Fehler („duplicated mapping key“), und
      # electron-builder bricht ab, bevor es zu packen beginnt (Editor 0.5.0, Lauf 28383418230).
      - name: Inject electron version + disable npmRebuild into config
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          cfg="apps/$APP/electron-builder.yml"
          ver=$(node -p "require('electron/package.json').version")
          if grep -q '^electronVersion:' "$cfg"; then
            echo "electronVersion steht schon in $cfg — unverändert"
          else
            printf '\nelectronVersion: %s\n' "$ver" >> "$cfg"
            echo "electronVersion=$ver ergänzt"
          fi
          if grep -q '^npmRebuild:' "$cfg"; then
            echo "npmRebuild steht schon in $cfg — unverändert"
          else
            printf 'npmRebuild: false\n' >> "$cfg"
            echo "npmRebuild=false ergänzt"
          fi

      # Tool-spezifische Vorbereitung (z. B. media-converter bündelt ffmpeg).
      # Tools ohne `prepackage`-Script werden dank --if-present übersprungen.
      - name: Prepare bundled binaries (if any)
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: npm run prepackage -w "@jm/$APP" --if-present

      - name: Package (electron-builder, unsigniert)
        working-directory: apps/${{ matrix.app }}
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: jm-${{ matrix.app }}-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            apps/${{ matrix.app }}/release/*.dmg
            apps/${{ matrix.app }}/release/*.exe
