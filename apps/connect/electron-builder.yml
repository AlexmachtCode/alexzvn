appId: gmbh.jakobs.connect
productName: JM Connect
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
copyright: "© Jakobs Medien GmbH"

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # Zweite Absicherung (Spec Stage 4, 5.1 und Ergänzung 0.18): @jm/zoom-bridge steht nur
  # in den devDependencies und wird gebündelt - sein Paketordner (build/, release/ mit dem
  # KOMPLETT-ZIP) gehört nie in die app.asar.
  - "!**/node_modules/@jm/zoom-bridge/**"

extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"

asar: true

# Wächter 2 (Spec Stage 4, 10.3): läuft, wenn release/win-unpacked steht, und vor dem
# NSIS-Installer. Bricht ab bei einer Zoom-SDK-Datei im Ordner oder IN der app.asar und
# unter Windows, wenn resources/zoom-bridge/zoom-bridge.exe fehlt.
afterPack: tools/after-pack.cjs

# NDI wird LOKAL auf Windows gebaut (NDI-SDK nicht in CI verfügbar; der
# suite-release-Workflow überspringt dieses Tool — Tag-Präfix `connect-v`). electron ist
# im Workspace ans Root gehoistet → electron-builder findet die Version sonst nicht;
# npmRebuild aus, weil das native Addon bereits via electron-rebuild gebaut + von
# bundle-ndi nach resources/bin/win gestaged wird. electronVersion bei Electron-Upgrade nachziehen.
electronVersion: 33.4.11
npmRebuild: false

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.video
  icon: build/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: JM Connect
  # Desktop-Icon nur für den Launcher (Suite-Politik) — Tools bleiben ohne.
  createDesktopShortcut: false

publish:
  provider: github
  owner: AlexmachtCode
  repo: alexzvn
  private: true
