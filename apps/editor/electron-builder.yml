appId: gmbh.jakobs.editor
productName: JM Editor
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
copyright: "© Jakobs Medien GmbH"

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"

asar: true

# ffmpeg/ffprobe werden via prepackage (bundle-ffmpeg) nach resources/bin/win
# gestaged. electron ist im Workspace ans Root gehoistet → electron-builder
# findet die Version sonst nicht (Fehler „Cannot compute electron version") →
# hier fixieren; bei Electron-Upgrade nachziehen. npmRebuild aus (keine nativen
# Addons im Editor). Gleiches Muster wie recorder/daw.
electronVersion: 33.4.11
npmRebuild: false

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.video
  icon: build/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: JM Editor
  createDesktopShortcut: false

publish:
  provider: github
  owner: AlexmachtCode
  repo: alexzvn
  private: true
