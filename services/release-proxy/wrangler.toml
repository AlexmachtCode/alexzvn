name = "jm-suite-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Rate-Limit-Speicher (Anti-Spam auf /feedback + /cookbook/draft, P3/#61).
# Namespace EINMALIG anlegen, die ausgegebene id unten eintragen, dann die drei
# Zeilen einkommentieren und neu deployen:
#   npx wrangler kv namespace create RATELIMIT
# Solange die Bindung fehlt, laufen beide Endpunkte UNGEDROSSELT (Worker-Log warnt
# pro Aufruf). Input-Größenlimits + Fehler-Redaktion sind davon unabhängig und
# sofort nach dem Deploy aktiv.
[[kv_namespaces]]
binding = "RATELIMIT"
id = "e704747ca2284601a1ed1ef1dc7ee98f"

# Q&A externe Einreichung (#166): Speicher für Event-Metadaten (Public Key,
# Presse-Code-Hash) + Ende-zu-Ende-verschlüsselte Einreichungen. Der Worker sieht
# NUR Chiffretext (Blind-Relay, siehe docs/qa/external-submission.md). Namespace
# EINMALIG anlegen, id eintragen, Zeilen einkommentieren, neu deployen:
#   npx wrangler kv namespace create QA_RELAY
# Ohne diese Bindung antworten die Q&A-Admin-Routen mit 503 (Feature inaktiv).
[[kv_namespaces]]
binding = "QA_RELAY"
id = "9e73a7425fb446d78ed7080a1d2fd080"

# Remote-Zuschaltung / Signalling (Welle 6, „JM Connect"): der ConnectRoom Durable Object hält je
# Raum den autoritativen Zustand (Warteraum/Freigabe/Tally) + die WebSockets (Hibernation). DOs
# brauchen KEIN Pre-Provisioning wie KV — sie entstehen beim Deploy über die Migration unten.
[[durable_objects.bindings]]
name = "CONNECT_ROOM"
class_name = "ConnectRoom"

# Anmeldung im Launcher (Plan Teil 1, EP1): EIN Konten-DO (idFromName("konten")) für Konten, Geräte, Anmeldevorgänge,
# Einladungen, Zoom-Anfragen, iveo-Tokens (nur verschlüsselt), Protokoll und die Zählung alter Schlüssel. SQLite-gestützt,
# in der EU (KONTO_JURISDICTION); er entsteht beim Deploy über die Migration v2, ohne Vorab-Anlegen.
[[durable_objects.bindings]]
name = "KONTO"
class_name = "KontoSpeicher"

# Erste Migration des Workers (bisher keine DOs). SQLite-gestützter DO (moderner Default) — die
# storage.put/get-API bleibt nutzbar. Bei Klassen-Umbenennung/-Entfernung neuen Tag anhängen.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConnectRoom"]

# Anmeldung im Launcher (EP1): zweite Migration, legt den SQLite-DO KontoSpeicher an. Tags bleiben, wie sie sind.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["KontoSpeicher"]

# Optionale Secrets für die Remote-Zuschaltung (verschlüsselt via `wrangler secret put`):
#   RTC_SFU_APP_ID / RTC_SFU_APP_TOKEN     Cloudflare-Realtime-SFU-App (Medien). Fehlen sie, läuft
#                                          der Raum im „Signalling-only"-Modus (Warteraum/Freigabe/
#                                          Tally ok, Medien übersprungen).
#   RTC_TURN_KEY_ID / RTC_TURN_API_TOKEN   Cloudflare-TURN-Schlüssel (NAT-Relay). Fehlen sie, liefert
#                                          /connect/:room/ice nur STUN (Dev-Fallback).

# Klartext-Variablen.
[vars]
# Das Mono-Repo mit den Releases.
REPO = "AlexmachtCode/alexzvn"
# Branch/Ref, aus dem der Live-Katalog (suite.json + changelog.json + cookbook.json)
# gelesen wird.
# Seit dem Merge von feat/suite-newtools nach main ist das der Default-Branch.
# Bei einem Wechsel hier ändern, dann `npx wrangler deploy` UND die Repo-Variable
# MANIFEST_BRANCH (CI-Bump-Ziel) synchron halten — sonst Katalog-Drift.
MANIFEST_REF = "main"
# Modell fürs Kochbuch-KI-Authoring (/cookbook/draft). Default claude-opus-4-8;
# für günstiger auskommentieren und z. B. auf claude-sonnet-4-6 setzen.
# COOKBOOK_MODEL = "claude-sonnet-4-6"
# EU-Datenresidenz der Zuschaltungs-Räume (Welle 6.6). "eu" pinnt jeden ConnectRoom-DO hart auf
# die EU — Gästenamen, Einwilligungen und Tally verlassen sie nicht. Leerstring schaltet das ab
# (nur für lokale `wrangler dev`-Läufe, die keine Jurisdictions kennen).
# ⚠️ NICHT im Betrieb ändern: derselbe Raumname ergibt in einer anderen Jurisdiction eine ANDERE
# Objekt-ID, bestehende Räume wären verwaist. Die MEDIEN (Realtime-SFU/TURN) deckt das nicht ab —
# siehe docs/security/connect-datenresidenz.md.
CONNECT_JURISDICTION = "eu"
# EU-Datenresidenz der Konten (Anmeldung im Launcher, EP1): "eu" pinnt den Konten-DO hart auf die EU, wie
# CONNECT_JURISDICTION die Räume. Leerstring nur für lokale Läufe ohne Jurisdictions. NICHT im Betrieb ändern: in einer
# anderen Jurisdiction wäre es ein anderer DO, alle Konten und Geräte wären verwaist.
KONTO_JURISDICTION = "eu"
# Ende des alten PROXY_KEY (Spec 10, EP9) als Datum JJJJ-MM-TT (00:00 UTC) oder mit Uhrzeit und Zone. Ab dann lehnt der
# Worker den alten Schlüssel für Katalog, Installieren, Updates, Kochbuch, Feedback, KI-Entwurf und Q&A ab (S4). Fehlt der
# Wert, gilt er unbefristet, und der Reiter Geräte der Admin-Maske zeigt das. Den Wert setzt der Controller nach dem
# Release (Release + 30 Tage, OF2); ein unlesbarer Wert hieße ebenfalls unbefristet, die Bauprobe meldet ihn (Exit 1):
# ALTKEY_BIS = "JJJJ-MM-TT"
# Eigene Frist für die Connect-Routen (EP9): bleibt in Teil 1 leer, Connect 0.3.0/0.4.0 kennt nur den Proxy-Key. Sie läuft
# erst ab dem Release von Teil 2 (dann 30 Tage):
# ALTKEY_CONNECT_BIS = "JJJJ-MM-TT"
# Privates Repo mit dem Zoom-SDK-Paket für GET /zoom-sdk/:fassung (JM Connect 0.2.2). Das GITHUB_TOKEN
# braucht darauf Contents: read, sonst antwortet GitHub 404 und die Route meldet not_found.
ZOOM_SDK_REPO = "AlexmachtCode/jm-zoom-sdk"

# Secrets der Anmeldung im Launcher (Plan Teil 1; verschlüsselt wie die übrigen, nie in [vars]; sie setzt der Controller
# mit Freigabe des Owners, README Abschnitt „Anmeldung im Launcher (Teil 1)“):
#   KONTO_SCHLUESSEL      32 Byte, Base64: signiert Sitzungen und Freigaben (jm1.…). Fehlt er, antworten die Pfade unter
#                         /konto/ mit 503 (S5); ein Wechsel macht alle Sitzungen und Freigaben ungültig.
#   IVEO_SCHLUESSEL       32 Byte, Base64: verschlüsselt hinterlegte iveo-Tokens (AES-GCM); ein Wechsel macht sie unlesbar.
#   GOOGLE_CLIENT_ID      OAuth-Web-Client des Workspaces jakobsmedien.com („intern“), Rückkehradresse
#   GOOGLE_CLIENT_SECRET  <Worker>/konto/google/zurueck. Fehlen sie, zeigt die Anmeldeseite nur die Passwort-Anmeldung (B6).
#   ERSTER_ADMIN          Google-Adresse (jakobsmedien.com) des ersten Admins: immer Admin, nicht herabzustufen oder zu sperren; zählt ab seiner ersten Anmeldung, eine andere Adresse wirkt nicht (EP20).

# Secrets NICHT hier eintragen — verschlüsselt setzen:
#   npx wrangler secret put GITHUB_TOKEN      (fine-grained PAT; read-only Contents reicht
#                                              für Katalog/Feedback. /cookbook/draft braucht
#                                              zusätzlich Contents:write + Pull requests:write)
#   npx wrangler secret put PROXY_KEY         (gemeinsamer Zugriffs-Key)
#   npx wrangler secret put ANTHROPIC_API_KEY (nur für /cookbook/draft mode "ai")
#   npx wrangler secret put ZOOM_SDK_KEY      (nur für /zoom-sdk/:fassung; der Owner tippt ihn ein,
#                                              er steht in keinem Repo, CI-Secret oder Build;
#                                              zufällig, mindestens 32 Zeichen; nur druckbare ASCII-
#                                              Zeichen ohne Leerzeichen, anderes lehnt Connect ab)
