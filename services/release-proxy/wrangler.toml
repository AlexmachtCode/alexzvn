name = "jm-suite-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Rate-Limit-Speicher (Anti-Spam auf /feedback + /cookbook/draft, P3/#61).
# Namespace EINMALIG anlegen, die ausgegebene id unten eintragen, dann die drei
# Zeilen einkommentieren und neu deployen:
#   npx wrangler kv namespace create RATELIMIT
# Solange die Bindung fehlt, laufen beide Endpunkte UNGEDROSSELT (Worker-Log warnt
# pro Aufruf). Input-Größenlimits + Fehler-Redaktion sind davon unabhängig und
# sofort nach dem Deploy aktiv.
# [[kv_namespaces]]
# binding = "RATELIMIT"
# id = "<KV_NAMESPACE_ID_EINTRAGEN>"

# Q&A externe Einreichung (#166): Speicher für Event-Metadaten (Public Key,
# Presse-Code-Hash) + Ende-zu-Ende-verschlüsselte Einreichungen. Der Worker sieht
# NUR Chiffretext (Blind-Relay, siehe docs/qa/external-submission.md). Namespace
# EINMALIG anlegen, id eintragen, Zeilen einkommentieren, neu deployen:
#   npx wrangler kv namespace create QA_RELAY
# Ohne diese Bindung antworten die Q&A-Admin-Routen mit 503 (Feature inaktiv).
# [[kv_namespaces]]
# binding = "QA_RELAY"
# id = "<KV_NAMESPACE_ID_EINTRAGEN>"

# Klartext-Variablen.
[vars]
# Das Mono-Repo mit den Releases.
REPO = "AlexmachtCode/alexzvn"
# Branch/Ref, aus dem der Live-Katalog (suite.json + changelog.json + cookbook.json)
# gelesen wird.
# Seit dem Merge von feat/suite-newtools nach main ist das der Default-Branch.
# Bei einem Wechsel hier ändern, dann `npx wrangler deploy` UND die Repo-Variable
# MANIFEST_BRANCH (CI-Bump-Ziel) synchron halten — sonst Katalog-Drift.
MANIFEST_REF = "main"
# Modell fürs Kochbuch-KI-Authoring (/cookbook/draft). Default claude-opus-4-8;
# für günstiger auskommentieren und z. B. auf claude-sonnet-4-6 setzen.
# COOKBOOK_MODEL = "claude-sonnet-4-6"

# Secrets NICHT hier eintragen — verschlüsselt setzen:
#   npx wrangler secret put GITHUB_TOKEN      (fine-grained PAT; read-only Contents reicht
#                                              für Katalog/Feedback. /cookbook/draft braucht
#                                              zusätzlich Contents:write + Pull requests:write)
#   npx wrangler secret put PROXY_KEY         (gemeinsamer Zugriffs-Key)
#   npx wrangler secret put ANTHROPIC_API_KEY (nur für /cookbook/draft mode "ai")
