title = "JM Production Suite — gitleaks"

# Standard-Regelsatz von gitleaks verwenden (API-Keys, private Schlüssel, Tokens …).
[extend]
useDefault = true

# iveo Public REST API — Bearer-Token (`iveo_live_…`, §2/§3 des Consumer-Guide).
# Ist ein Secret und darf nie ins Repo. Die {20,}-Länge lässt kurze Test-Platzhalter
# wie `iveo_live_SECRET` bewusst durch.
[[rules]]
id = "jm-iveo-token"
description = "iveo API Bearer-Token"
regex = '''iveo_live_[A-Za-z0-9]{20,}'''
keywords = ["iveo_live_"]

# Bekannte, bewusste Nicht-Secrets von der Prüfung ausnehmen.
[allowlist]
description = "Wegwerf-Material in Tests/Doku — keine echten Geheimnisse"
paths = [
  # Selbstsigniertes Throwaway-EC-Zertifikat (embedded) für den TLS-Integrationstest
  # des Steuerprotokolls — generiert, nicht produktiv, kein echtes Secret.
  # [\\/] statt /, damit der Ausschluss auch bei einem lokalen Lauf unter Windows greift.
  '''packages[\\/]suite-control-protocol[\\/]test[\\/]integration\.ts''',
]
# Erfundene Testwerte, die die Standardregel generic-api-key trifft. Nur der genaue Wert,
# nicht die Datei: ein echtes Secret in derselben Testdatei würde weiter gemeldet.
regexes = [
  # Zoom Stage 4a: Client-ID der Zugangsdaten-Fälle in apps/connect/test/zoom-kern.test.ts
  # und im Plan docs/superpowers/plans/2026-10-02-zoom-stage4a-connect.md, der sie zitiert.
  '''^sitzung-9876$''',
]
